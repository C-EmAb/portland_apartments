<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Available Listings</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root {
  color-scheme: light;
  --bg: #EDF0EE; --surface: #FFFFFF; --ink: #1C2428; --muted: #56646A; --line: #D3DAD6;
  --accent: #24505F; --accent-ink: #FFFFFF;
  --pass: #2F6B47; --pass-bg: #E1EEE5;
  --maybe: #7A4F08; --maybe-bg: #F6EBD3;
  --no: #8E2A2A; --no-bg: #F5E1E1;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #131A1C; --surface: #1C2427; --ink: #E5ECEA; --muted: #9DABA9; --line: #2E393C;
    --accent: #8CC3D3; --accent-ink: #10262E;
    --pass: #86CDA0; --pass-bg: #1E3427;
    --maybe: #E6BC69; --maybe-bg: #3A2F18;
    --no: #EE9A9A; --no-bg: #3D2121;
  }
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 var(--body); }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 20px; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

.top { padding: 22px 0 10px; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tabs a { text-decoration: none; color: var(--muted); padding: 6px 12px; border-radius: 8px; font-weight: 700; }
.tabs a[aria-current="page"] { color: var(--ink); background: var(--surface); box-shadow: inset 0 -3px 0 var(--accent); }
.auth { display: flex; gap: 10px; align-items: center; color: var(--muted); font-size: .95rem; }
h1 { font: 700 clamp(2.1rem, 5vw, 3.4rem)/1.02 var(--display); letter-spacing: -0.025em; margin: 10px 0 6px; }
.status { margin: 0 0 16px; color: var(--muted); max-width: 75ch; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 7px 14px; cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.btn.on { background: var(--pass-bg); color: var(--pass); border-color: var(--pass); }
.btn.warn { color: var(--no); }

.refine { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 18px; }
.refine summary { cursor: pointer; padding: 12px 16px; font-weight: 700; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; }
.refine summary span { font-weight: 400; color: var(--muted); }
.rgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px 22px; padding: 4px 16px 16px; }
fieldset { border: none; margin: 0; padding: 0; }
legend { font-weight: 700; margin-bottom: 4px; }
.rgrid label { display: flex; gap: 8px; align-items: center; padding: 2px 0; }
.rgrid input[type="checkbox"], .rgrid input[type="radio"], .rgrid input[type="range"] { accent-color: var(--accent); }
.rgrid input[type="range"] { width: 100%; }
.rgrid select { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.rfoot { display: flex; align-items: end; }

.deck { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 26px; }
@media (max-width: 860px) { .deck { grid-template-columns: 1fr; } }
.frame { position: relative; aspect-ratio: 4 / 3; background: var(--line); border-radius: 14px; overflow: hidden; display: grid; place-items: center; color: var(--muted); }
.frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
.new { position: absolute; top: 14px; left: 14px; background: var(--accent); color: var(--accent-ink); font-weight: 700; padding: 3px 12px; border-radius: 999px; }
.pnav { position: absolute; top: 50%; translate: 0 -50%; width: 46px; height: 46px; border-radius: 50%; border: none; background: rgb(0 0 0 / .55); color: #fff; font-size: 1.6rem; line-height: 1; cursor: pointer; }
.pnav.prev { left: 12px; } .pnav.next { right: 12px; }
.pcount { position: absolute; bottom: 12px; right: 12px; background: rgb(0 0 0 / .6); color: #fff; padding: 2px 10px; border-radius: 999px; font-size: .9rem; }
.strip { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 2px; }
.strip button { all: unset; cursor: pointer; flex: 0 0 auto; border-radius: 6px; overflow: hidden; border: 2px solid transparent; }
.strip button[aria-current="true"] { border-color: var(--accent); }
.strip button:focus-visible { outline: 3px solid var(--accent); }
.strip img { width: 84px; height: 63px; object-fit: cover; display: block; }

.panel .rent { font: 700 clamp(2.4rem, 5vw, 3.2rem)/1 var(--display); letter-spacing: -0.02em; margin: 0; }
.panel .rent span { font: 400 1rem var(--body); color: var(--muted); margin-left: 3px; }
.fees { margin: 4px 0 0; color: var(--muted); }
.panel h2 { font: 700 1.45rem/1.2 var(--display); margin: 14px 0 2px; }
.meta { color: var(--muted); margin: 0; }
.chips { list-style: none; padding: 0; margin: 14px 0; display: grid; gap: 5px; }
.chip { padding: 6px 11px; border-left: 4px solid; border-radius: 4px; }
.chip.pass  { color: var(--pass);  background: var(--pass-bg); }
.chip.maybe { color: var(--maybe); background: var(--maybe-bg); }
.chip.no    { color: var(--no);    background: var(--no-bg); }
.panel h3 { font-size: 1rem; margin: 16px 0 4px; }
.panel ul.reasons { margin: 0; padding-left: 20px; }
.contact { display: grid; gap: 4px; justify-items: start; }
.contact a { color: var(--accent); }
.acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
details.desc { margin-top: 16px; }
details.desc summary { cursor: pointer; font-weight: 700; }
details.desc p { white-space: pre-line; max-width: 65ch; }
.seen { color: var(--muted); font-size: .9rem; margin-top: 14px; }

.decknav { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 20px 0 50px; }
.decknav span { color: var(--muted); }
.empty { text-align: center; padding: 70px 20px; color: var(--muted); }

#mapEl { height: min(72vh, 720px); border-radius: 14px; border: 1px solid var(--line); }
.mapnote { color: var(--muted); padding: 10px 0 40px; }
.leaflet-popup-content { font: 15px/1.4 var(--body); margin: 12px 14px; }
.pop img { width: 200px; height: 130px; object-fit: cover; border-radius: 6px; display: block; margin-bottom: 6px; }
.pop b { font-size: 1.15rem; }

.sup { display: grid; gap: 10px; padding-bottom: 50px; }
.suprow { display: grid; grid-template-columns: 96px 1fr auto; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
.suprow img, .suprow .ph { width: 96px; height: 72px; object-fit: cover; border-radius: 8px; background: var(--line); }
.suprow p { margin: 0; }
.suprow .meta a { color: var(--accent); }
@media (max-width: 600px) { .suprow { grid-template-columns: 72px 1fr; } .suprow img, .suprow .ph { width: 72px; height: 54px; } .suprow .btn { grid-column: 1 / -1; } }

dialog { border: none; border-radius: 14px; padding: 22px; width: min(420px, 92vw); background: var(--surface); color: var(--ink); }
dialog::backdrop { background: rgb(10 16 18 / .6); }
dialog h2 { font: 700 1.4rem var(--display); margin: 0 0 6px; }
dialog input { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); margin: 10px 0; }
dialog .row { display: flex; gap: 8px; justify-content: flex-end; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); translate: -50% 0; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; display: flex; gap: 14px; align-items: center; z-index: 2000; max-width: 92vw; }
.toast button { background: none; border: none; color: inherit; text-decoration: underline; cursor: pointer; font-weight: 700; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <nav class="tabs" aria-label="Pages">
      <a href="#slides" data-route="slides">Available Listings</a>
      <a href="#map" data-route="map">Map</a>
      <a href="#suppressed" data-route="suppressed">Suppressed</a>
    </nav>
    <div class="auth" id="authBox"></div>
  </header>

  <h1 id="pageTitle">Available Listings</h1>
  <p id="status" class="status">Loading listings…</p>

  <details class="refine" id="refine">
    <summary>Refine <span id="refineSummary"></span></summary>
    <div class="rgrid">
      <fieldset>
        <legend>Show</legend>
        <label><input type="radio" name="show" value="all"> All listings</label>
        <label><input type="radio" name="show" value="new"> New since the last check</label>
        <label><input type="radio" name="show" value="strong"> Strong matches</label>
        <label><input type="radio" name="show" value="unclear"> Worth a check</label>
        <label><input type="radio" name="show" value="saved"> Saved</label>
      </fieldset>
      <fieldset>
        <legend>Max rent: <output id="maxRentOut"></output></legend>
        <input type="range" id="maxRent" min="900" max="1650" step="25" aria-label="Maximum rent">
        <legend style="margin-top:14px">Bedrooms</legend>
        <label><input type="checkbox" name="beds" value="1"> 1 bedroom</label>
        <label><input type="checkbox" name="beds" value="2"> 2 bedrooms</label>
      </fieldset>
      <fieldset>
        <legend>Area</legend>
        <label><input type="checkbox" name="areas" value="N"> N</label>
        <label><input type="checkbox" name="areas" value="NE"> NE</label>
        <label><input type="checkbox" name="areas" value="SE"> SE</label>
        <label><input type="checkbox" name="areas" value="NW"> NW</label>
        <label><input type="checkbox" name="areas" value="SW"> SW</label>
        <label><input type="checkbox" name="areas" value="S"> S</label>
        <label><input type="checkbox" name="areas" value="Other"> Address doesn’t say</label>
      </fieldset>
      <fieldset>
        <legend>Must be confirmed</legend>
        <label><input type="checkbox" id="mustWD"> Washer/dryer in unit</label>
        <label><input type="checkbox" id="mustParking"> Parking</label>
        <label><input type="checkbox" id="mustUp"> 2nd floor or higher</label>
        <legend style="margin-top:14px">Company</legend>
        <select id="company" aria-label="Company"><option value="">Any company</option></select>
      </fieldset>
      <fieldset>
        <legend>Order</legend>
        <select id="sort" aria-label="Order">
          <option value="newest">Newest first</option>
          <option value="rent">Lowest rent first</option>
          <option value="strong">Strong matches first</option>
        </select>
        <div class="rfoot" style="margin-top:14px"><button class="btn" id="resetRefine" type="button">Reset refinements</button></div>
      </fieldset>
    </div>
  </details>

  <section id="view-slides">
    <div id="slide"></div>
    <div class="decknav" id="decknav">
      <button class="btn" id="prevL">Previous listing</button>
      <span id="deckPos"></span>
      <button class="btn primary" id="nextL">Next listing</button>
    </div>
  </section>

  <section id="view-map" hidden>
    <div id="mapEl" role="region" aria-label="Map of listings"></div>
    <p class="mapnote" id="mapNote"></p>
  </section>

  <section id="view-suppressed" hidden>
    <div class="sup" id="supList"></div>
  </section>
</div>

<dialog id="signin" aria-labelledby="signinTitle">
  <h2 id="signinTitle">Sign in</h2>
  <p class="meta" id="signinMsg">Signing in lets you save and suppress listings, and keeps them in sync between your devices.</p>
  <form id="signinForm" method="dialog">
    <input type="email" id="email" required autocomplete="email" placeholder="you@example.com" aria-label="Email address">
    <div class="row">
      <button class="btn" type="button" id="signinCancel">Cancel</button>
      <button class="btn primary" type="submit" id="signinSend">Email me a sign-in link</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ---------- basics ----------
const cfg = window.APP_CONFIG || {};
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '#';
const money = n => n == null ? 'Rent not listed' : '$' + Number(n).toLocaleString('en-US');
const isoDate = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const today = () => isoDate(new Date());
const fmtDate = d => d ? new Date(d + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' }) : '';
const shortDate = d => d ? new Date(d + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '';
const norm = s => String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
const local = {
  get(k, fb) { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? fb; } catch { return fb; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

const sb = (cfg.SUPABASE_URL && cfg.SUPABASE_ANON_KEY && window.supabase)
  ? window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY) : null;

let user = null, listings = [], marks = [], latestDate = null, loaded = false;
let deck = [], pos = 0, photoPos = 0, route = 'slides';

// ---------- toast ----------
let toastTimer;
function toast(msg, undo) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button type="button">Undo</button>' : ''}`;
  t.hidden = false;
  if (undo) t.querySelector('button').onclick = () => { t.hidden = true; undo(); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 6000);
}

// ---------- listing helpers ----------
const isNew = l => latestDate && l.first_seen === latestDate;
const areaOf = l => { const m = String(l.address || '').match(/\b(NE|SE|NW|SW|N|S)\.?\s+[A-Za-z0-9]/); return m ? m[1] : 'Other'; };
const activeSuppressions = () => { const t = today(); return marks.filter(m => m.kind === 'suppressed' && (!m.until || m.until > t)); };
const isSuppressed = l => activeSuppressions().some(m => m.listing_url === l.listing_url || (m.address && norm(m.address) === norm(l.address)));
const isSaved = l => marks.some(m => m.kind === 'saved' && m.listing_url === l.listing_url);
const bedLabel = l => l.beds == null ? '' : `${l.beds} bedroom${Number(l.beds) === 1 ? '' : 's'}`;

function chips(l) {
  const wd = { in_unit: ['pass', 'Washer/dryer in unit'], no: ['no', 'No washer/dryer in unit'] }[l.washer_dryer] || ['maybe', 'Washer/dryer unclear'];
  const pk = l.parking === 'yes' ? ['pass', l.parking_note ? `Parking: ${l.parking_note}` : 'Parking available']
           : l.parking === 'no' ? ['no', 'No easy parking'] : ['maybe', l.parking_note ? `Parking unclear: ${l.parking_note}` : 'Parking unclear'];
  const f = l.floor_level;
  const fl = f == null ? ['maybe', l.floor ? `Floor: ${l.floor}` : 'Floor unclear'] : f >= 2 ? ['pass', l.floor || `Floor ${f}`] : ['maybe', 'Ground floor'];
  return [wd, pk, fl].map(([k, t]) => `<li class="chip ${k}">${esc(t)}</li>`).join('');
}

function facts(l) {
  return [bedLabel(l), l.baths != null ? `${l.baths} bath` : '', l.sqft ? `${l.sqft} sq ft` : '',
          l.property_type || '', l.available_date ? `available ${l.available_date}` : ''].filter(Boolean).join(', ');
}

// ---------- refine ----------
const DEFAULTS = { show: 'all', maxRent: 1650, beds: ['1', '2'], areas: ['N', 'NE', 'SE', 'NW', 'SW', 'S', 'Other'], wd: false, parking: false, up: false, company: '', sort: 'newest' };
let refine = { ...DEFAULTS, ...local.get('refine', {}) };

function passes(l) {
  if (l.status === 'application_pending' || isSuppressed(l)) return false;
  if (l.rent != null && l.rent > refine.maxRent) return false;
  if (l.beds != null && !refine.beds.includes(String(Math.round(l.beds)))) return false;
  if (!refine.areas.includes(areaOf(l))) return false;
  if (refine.wd && l.washer_dryer !== 'in_unit') return false;
  if (refine.parking && l.parking !== 'yes') return false;
  if (refine.up && !(l.floor_level >= 2)) return false;
  if (refine.company && l.company !== refine.company) return false;
  if (refine.show === 'new' && !isNew(l)) return false;
  if (refine.show === 'strong' && l.match !== 'strong') return false;
  if (refine.show === 'unclear' && l.match !== 'unclear') return false;
  if (refine.show === 'saved' && !isSaved(l)) return false;
  return true;
}

function sorter(a, b) {
  const rent = (a.rent ?? 1e9) - (b.rent ?? 1e9);
  const newest = (b.first_seen || '').localeCompare(a.first_seen || '');
  if (refine.sort === 'rent') return rent || newest;
  if (refine.sort === 'strong') return (a.match === 'strong' ? 0 : 1) - (b.match === 'strong' ? 0 : 1) || newest || rent;
  return newest || rent;
}

function syncRefineControls() {
  $$('input[name="show"]').forEach(i => i.checked = i.value === refine.show);
  $('#maxRent').value = refine.maxRent; $('#maxRentOut').textContent = money(refine.maxRent);
  $$('input[name="beds"]').forEach(i => i.checked = refine.beds.includes(i.value));
  $$('input[name="areas"]').forEach(i => i.checked = refine.areas.includes(i.value));
  $('#mustWD').checked = refine.wd; $('#mustParking').checked = refine.parking; $('#mustUp').checked = refine.up;
  const companies = [...new Set(listings.map(l => l.company).filter(Boolean))].sort();
  $('#company').innerHTML = '<option value="">Any company</option>' + companies.map(c => `<option${c === refine.company ? ' selected' : ''}>${esc(c)}</option>`).join('');
  $('#sort').value = refine.sort;
}

function readRefineControls() {
  refine = {
    show: ($$('input[name="show"]').find(i => i.checked) || {}).value || 'all',
    maxRent: +$('#maxRent').value,
    beds: $$('input[name="beds"]').filter(i => i.checked).map(i => i.value),
    areas: $$('input[name="areas"]').filter(i => i.checked).map(i => i.value),
    wd: $('#mustWD').checked, parking: $('#mustParking').checked, up: $('#mustUp').checked,
    company: $('#company').value, sort: $('#sort').value
  };
  local.set('refine', refine);
  $('#maxRentOut').textContent = money(refine.maxRent);
  rebuild(currentUrl());
}

function refineSummary() {
  const bits = [];
  if (refine.show !== 'all') bits.push({ new: 'new only', strong: 'strong matches', unclear: 'worth a check', saved: 'saved only' }[refine.show]);
  if (refine.maxRent < 1650) bits.push(`up to ${money(refine.maxRent)}`);
  if (refine.beds.length < 2) bits.push(refine.beds.length ? `${refine.beds[0]} bedroom` : 'no bedrooms picked');
  if (refine.areas.length < DEFAULTS.areas.length) bits.push(`areas: ${refine.areas.filter(a => a !== 'Other').join(', ') || 'none'}`);
  if (refine.wd) bits.push('W/D confirmed');
  if (refine.parking) bits.push('parking confirmed');
  if (refine.up) bits.push('2nd floor+');
  if (refine.company) bits.push(refine.company);
  const count = `${deck.length} listing${deck.length === 1 ? '' : 's'}`;
  $('#refineSummary').textContent = bits.length ? `${count} match: ${bits.join(', ')}` : `${count}, no refinements`;
}

// ---------- deck ----------
const currentUrl = () => deck[pos]?.listing_url;

function rebuild(keepUrl) {
  deck = listings.filter(passes).sort(sorter);
  const i = keepUrl ? deck.findIndex(l => l.listing_url === keepUrl) : -1;
  if (i >= 0) pos = i; else pos = Math.min(pos, Math.max(deck.length - 1, 0));
  if (i < 0) photoPos = 0;
  refineSummary();
  renderSlide();
  if (route === 'map') drawMarkers(false);
  if (route === 'suppressed') renderSuppressed();
}

function renderSlide() {
  const box = $('#slide');
  $('#decknav').hidden = deck.length < 1;
  if (!loaded) return;
  if (!deck.length) {
    box.innerHTML = listings.length
      ? `<div class="empty"><p>No listings match your refinements.</p><button class="btn" data-act="reset">Reset refinements</button></div>`
      : `<div class="empty"><p>No listings yet. They’ll appear here after the first daily check.</p></div>`;
    $('#deckPos').textContent = '';
    return;
  }
  const l = deck[pos], photos = l.photos || [];
  photoPos = Math.min(photoPos, Math.max(photos.length - 1, 0));
  const saved = isSaved(l);
  $('#deckPos').textContent = `${pos + 1} of ${deck.length}`;
  box.innerHTML = `<article class="deck" aria-label="Listing ${pos + 1} of ${deck.length}">
    <div class="stage">
      <div class="frame">
        ${photos.length ? `<img id="slidePh" src="${esc(photos[photoPos])}" alt="Photo ${photoPos + 1} of ${photos.length} for ${esc(l.address || 'this listing')}" referrerpolicy="no-referrer">` : '<span>No photos on this listing</span>'}
        ${isNew(l) ? '<span class="new">New</span>' : ''}
        ${photos.length > 1 ? `<button class="pnav prev" data-act="prevPhoto" aria-label="Previous photo">‹</button>
          <button class="pnav next" data-act="nextPhoto" aria-label="Next photo">›</button>
          <span class="pcount">Photo ${photoPos + 1} of ${photos.length}</span>` : ''}
      </div>
      ${photos.length > 1 ? `<div class="strip">${photos.map((p, j) => `<button data-act="photo" data-j="${j}" aria-label="Show photo ${j + 1}" aria-current="${j === photoPos}"><img src="${esc(p)}" alt="" loading="lazy" referrerpolicy="no-referrer"></button>`).join('')}</div>` : ''}
    </div>
    <div class="panel">
      <p class="rent">${money(l.rent)}<span>/mo</span></p>
      ${l.fees_note ? `<p class="fees">${esc(l.fees_note)}</p>` : ''}
      <h2>${esc(l.address || l.title || 'Address not listed')}</h2>
      <p class="meta">${esc(facts(l))}</p>
      <ul class="chips">${chips(l)}</ul>
      ${(l.reasons || []).length ? `<h3>Check before applying</h3><ul class="reasons">${l.reasons.map(r => `<li>${esc(r)}</li>`).join('')}</ul>` : ''}
      <div class="contact">
        <h3>${esc(l.company || 'Contact')}</h3>
        ${l.contact_phone ? `<a href="tel:${esc(l.contact_phone.replace(/[^\d+]/g, ''))}">${esc(l.contact_phone)}</a>` : ''}
        ${l.contact_email ? `<a href="mailto:${esc(l.contact_email)}">${esc(l.contact_email)}</a>` : ''}
        <a href="${esc(safeUrl(l.listing_url))}" target="_blank" rel="noopener">Open the listing</a>
      </div>
      <div class="acts">
        <button class="btn ${saved ? 'on' : ''}" data-act="save" aria-pressed="${saved}">${saved ? 'Saved' : 'Save'}</button>
        <button class="btn" data-act="sup1">Suppress for one month</button>
        <button class="btn warn" data-act="supP">Suppress permanently</button>
      </div>
      ${l.description ? `<details class="desc"><summary>Listing description</summary><p>${esc(l.description)}</p></details>` : ''}
      <p class="seen">First seen ${esc(fmtDate(l.first_seen))}</p>
    </div>
  </article>`;
  const img = $('#slidePh');
  if (img) img.onerror = () => { img.replaceWith(Object.assign(document.createElement('span'), { textContent: 'This photo is no longer available' })); };
  const next = deck[(pos + 1) % deck.length];
  if (next?.photos?.[0]) { const pre = new Image(); pre.referrerPolicy = 'no-referrer'; pre.src = next.photos[0]; }
}

function step(d) {
  if (!deck.length) return;
  pos = (pos + d + deck.length) % deck.length; photoPos = 0;
  renderSlide();
  $('#view-slides').scrollIntoView({ block: 'start', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
}
function stepPhoto(d) {
  const n = (deck[pos]?.photos || []).length; if (n < 2) return;
  photoPos = (photoPos + d + n) % n; renderSlide();
}

// ---------- saves & suppressions ----------
function requireUser() {
  if (user) return true;
  $('#signinMsg').textContent = 'Sign in to save and suppress listings. They’ll stay in sync between your devices.';
  $('#signin').showModal();
  return false;
}
const snapshot = l => ({ listing_url: l.listing_url, title: l.title, address: l.address, company: l.company, photo: (l.photos || [])[0] || null });

async function toggleSave(l) {
  if (!requireUser()) return;
  if (isSaved(l)) {
    const { error } = await sb.from('marks').delete().eq('listing_url', l.listing_url).eq('kind', 'saved');
    if (error) return toast(`Couldn’t unsave: ${error.message}`);
    marks = marks.filter(m => !(m.kind === 'saved' && m.listing_url === l.listing_url));
  } else {
    const row = { ...snapshot(l), kind: 'saved' };
    const { error } = await sb.from('marks').upsert(row, { onConflict: 'user_id,listing_url,kind' });
    if (error) return toast(`Couldn’t save: ${error.message}`);
    marks.push(row);
  }
  rebuild(l.listing_url);
}

async function suppress(l, month) {
  if (!requireUser()) return;
  let until = null;
  if (month) { const d = new Date(); d.setMonth(d.getMonth() + 1); until = isoDate(d); }
  const row = { ...snapshot(l), kind: 'suppressed', until };
  const { error } = await sb.from('marks').upsert(row, { onConflict: 'user_id,listing_url,kind' });
  if (error) return toast(`Couldn’t suppress: ${error.message}`);
  marks = marks.filter(m => !(m.kind === 'suppressed' && m.listing_url === l.listing_url)).concat([{ ...row, created_at: new Date().toISOString() }]);
  rebuild();
  toast(month ? `Suppressed until ${shortDate(until)}` : 'Suppressed permanently', () => reinstate(l.listing_url));
}

async function reinstate(url) {
  const { error } = await sb.from('marks').delete().eq('listing_url', url).eq('kind', 'suppressed');
  if (error) return toast(`Couldn’t reinstate: ${error.message}`);
  marks = marks.filter(m => !(m.kind === 'suppressed' && m.listing_url === url));
  rebuild(currentUrl());
  toast('Reinstated. It’s back in Available Listings if it’s still listed.');
}

function renderSuppressed() {
  const box = $('#supList');
  if (!user) { box.innerHTML = `<div class="empty"><p>Sign in to see the listings you’ve suppressed.</p><button class="btn primary" data-act="signin">Sign in</button></div>`; return; }
  const rows = activeSuppressions().sort((a, b) => (b.created_at || '').localeCompare(a.created_at || ''));
  if (!rows.length) { box.innerHTML = `<div class="empty"><p>Nothing is suppressed. Use “Suppress for one month” or “Suppress permanently” on a slide to move a listing here.</p></div>`; return; }
  const live = new Set(listings.filter(l => l.status !== 'application_pending').map(l => l.listing_url));
  box.innerHTML = rows.map(m => `<div class="suprow">
      ${m.photo ? `<img src="${esc(m.photo)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : '<div class="ph"></div>'}
      <div>
        <p><b>${esc(m.address || m.title || m.listing_url)}</b></p>
        <p class="meta">${esc(m.company || '')}${m.company ? '. ' : ''}${m.until ? `Suppressed until ${esc(shortDate(m.until))}.` : 'Suppressed permanently.'} ${live.has(m.listing_url) ? 'Still listed.' : 'No longer listed.'}
          <a href="${esc(safeUrl(m.listing_url))}" target="_blank" rel="noopener">Open the listing</a></p>
      </div>
      <button class="btn" data-act="reinstate" data-url="${esc(m.listing_url)}">Reinstate</button>
    </div>`).join('');
}

// ---------- map ----------
let map, layer, geocoding = false, fitted = false;
const geo = local.get('geocache', {});
const cleanAddr = a => { let s = String(a || '').replace(/(#|\bunit\b|\bapt\.?|\bsuite\b)\s*[\w-]+/gi, '').replace(/\s+,/g, ',').replace(/\s{2,}/g, ' ').trim(); return /portland/i.test(s) ? s : `${s}, Portland, OR`; };
const geoKey = l => norm(cleanAddr(l.address));
const coords = l => (l.lat != null && l.lng != null) ? [l.lat, l.lng] : (Array.isArray(geo[geoKey(l)]) ? geo[geoKey(l)] : null);
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function initMap() {
  if (map || !window.L) return;
  map = L.map('mapEl', { scrollWheelZoom: true }).setView([45.515, -122.66], 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap contributors' }).addTo(map);
  L.polyline([[45.585, -122.5786], [45.433, -122.5786]], { color: cssVar('--muted'), weight: 2, dashArray: '6 6' })
    .bindTooltip('82nd Ave (eastern edge)', { sticky: true }).addTo(map);
  layer = L.layerGroup().addTo(map);
}

function drawMarkers(fit) {
  if (!map) return;
  layer.clearLayers();
  const pts = [], missing = [];
  deck.forEach((l, i) => {
    const c = coords(l);
    if (!c) { missing.push(l); return; }
    const strong = l.match === 'strong';
    const m = L.circleMarker(c, { radius: 10, weight: 2, color: cssVar('--surface'), fillColor: strong ? cssVar('--pass') : cssVar('--maybe'), fillOpacity: .95 });
    m.bindPopup(`<div class="pop">${l.photos?.[0] ? `<img src="${esc(l.photos[0])}" alt="" referrerpolicy="no-referrer">` : ''}
      <b>${money(l.rent)}</b>/mo<br>${esc(l.address || l.title || '')}<br>${esc(bedLabel(l))}${l.company ? `, ${esc(l.company)}` : ''}<br>
      <button class="btn" style="margin-top:8px" data-act="goSlide" data-i="${i}">View in Available Listings</button></div>`);
    m.addTo(layer); pts.push(c);
  });
  if ((fit || !fitted) && pts.length) { map.fitBounds(pts, { padding: [40, 40], maxZoom: 14 }); fitted = true; }
  const unplaceable = missing.filter(l => geo[geoKey(l)] === 'none' || !l.address);
  const pending = missing.length - unplaceable.length;
  $('#mapNote').textContent = [
    `${pts.length} of ${deck.length} listing${deck.length === 1 ? '' : 's'} on the map. Green is a strong match, yellow is worth a check.`,
    pending ? `Finding ${pending} more address${pending === 1 ? '' : 'es'}…` : '',
    unplaceable.length ? `Couldn’t place: ${unplaceable.map(l => l.address || l.title || 'a listing with no address').join('; ')}.` : ''
  ].filter(Boolean).join(' ');
  if (pending) geocodeMissing();
}

async function geocodeMissing() {
  if (geocoding) return; geocoding = true;
  for (const l of deck) {
    if (route !== 'map') break;
    if (coords(l) || !l.address || geo[geoKey(l)] === 'none') continue;
    try {
      const r = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=us&q=' + encodeURIComponent(cleanAddr(l.address)));
      const j = await r.json();
      geo[geoKey(l)] = j[0] ? [+j[0].lat, +j[0].lon] : 'none';
      local.set('geocache', geo);
    } catch { break; }
    await new Promise(res => setTimeout(res, 1100)); // the free address lookup allows about one request per second
  }
  geocoding = false;
  if (route === 'map') drawMarkers(false);
}

// ---------- routing ----------
const TITLES = { slides: 'Available Listings', map: 'Map', suppressed: 'Suppressed' };
function go(r) {
  route = TITLES[r] ? r : 'slides';
  $$('.tabs a').forEach(a => a.dataset.route === route ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  $('#pageTitle').textContent = TITLES[route];
  document.title = TITLES[route];
  $('#view-slides').hidden = route !== 'slides';
  $('#view-map').hidden = route !== 'map';
  $('#view-suppressed').hidden = route !== 'suppressed';
  $('#refine').hidden = route === 'suppressed';
  if (route === 'map') { initMap(); setTimeout(() => { map?.invalidateSize(); drawMarkers(false); }, 0); }
  if (route === 'suppressed') renderSuppressed();
}
window.addEventListener('hashchange', () => { if (!/access_token|error_description/.test(location.hash)) go(location.hash.slice(1)); });

// ---------- auth ----------
function renderAuth() {
  $('#authBox').innerHTML = user
    ? `<span>Signed in as ${esc(user.email)}</span><button class="btn" data-act="signout">Sign out</button>`
    : `<button class="btn" data-act="signin">Sign in</button>`;
}
async function loadMarks() {
  marks = [];
  if (!user) return;
  const { data, error } = await sb.from('marks').select('*');
  if (error) toast(`Couldn’t load your saves and suppressions: ${error.message}`);
  else marks = data || [];
}

$('#signinForm').addEventListener('submit', async e => {
  e.preventDefault();
  const email = $('#email').value.trim();
  if (!email) return;
  $('#signinSend').disabled = true;
  const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + location.pathname } });
  $('#signinSend').disabled = false;
  if (error) { $('#signinMsg').textContent = `The sign-in email didn’t send: ${error.message}`; return; }
  $('#signinMsg').textContent = `Sign-in link sent to ${email}. Open it on this device to finish signing in.`;
});
$('#signinCancel').addEventListener('click', () => $('#signin').close());

// ---------- events ----------
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const l = deck[pos];
  switch (b.dataset.act) {
    case 'prevPhoto': return stepPhoto(-1);
    case 'nextPhoto': return stepPhoto(1);
    case 'photo': photoPos = +b.dataset.j; return renderSlide();
    case 'save': return l && toggleSave(l);
    case 'sup1': return l && suppress(l, true);
    case 'supP': return l && suppress(l, false);
    case 'reinstate': return reinstate(b.dataset.url);
    case 'reset': refine = { ...DEFAULTS }; local.set('refine', refine); syncRefineControls(); return rebuild();
    case 'goSlide': pos = +b.dataset.i; photoPos = 0; location.hash = 'slides'; return;
    case 'signin': $('#signinMsg').textContent = 'Signing in lets you save and suppress listings, and keeps them in sync between your devices.'; return $('#signin').showModal();
    case 'signout': await sb.auth.signOut(); return;
  }
});
$('#prevL').addEventListener('click', () => step(-1));
$('#nextL').addEventListener('click', () => step(1));
$('#resetRefine').addEventListener('click', () => { refine = { ...DEFAULTS }; local.set('refine', refine); syncRefineControls(); rebuild(currentUrl()); });
$('#refine').addEventListener('input', e => { if (e.target.matches('input, select')) readRefineControls(); });
document.addEventListener('keydown', e => {
  if (route !== 'slides' || e.target.closest('input, select, textarea, dialog')) return;
  if (e.key === 'ArrowRight') step(1);
  if (e.key === 'ArrowLeft') step(-1);
});
let touchX = null;
$('#slide').addEventListener('touchstart', e => { if (e.target.closest('.frame')) touchX = e.touches[0].clientX; }, { passive: true });
$('#slide').addEventListener('touchend', e => {
  if (touchX == null) return;
  const dx = e.changedTouches[0].clientX - touchX; touchX = null;
  if (Math.abs(dx) > 45) stepPhoto(dx < 0 ? 1 : -1);
});

// ---------- start ----------
async function start() {
  syncRefineControls();
  go(/access_token/.test(location.hash) ? 'slides' : location.hash.slice(1));
  if (!sb) {
    $('#status').textContent = 'Add your Supabase project URL and publishable key to config.js to load listings.';
    $('#authBox').innerHTML = '';
    return;
  }
  const { data: { session } } = await sb.auth.getSession();
  user = session?.user || null;
  if (/access_token/.test(location.hash)) history.replaceState(null, '', location.pathname + '#slides');
  renderAuth();
  sb.auth.onAuthStateChange((_evt, s) => {
    const next = s?.user || null;
    if ((next?.id || null) === (user?.id || null)) return;
    setTimeout(async () => { user = next; renderAuth(); if (user) $('#signin').close(); await loadMarks(); rebuild(currentUrl()); }, 0);
  });
  try {
    const [res, runs] = await Promise.all([
      sb.from('listings').select('*').eq('is_active', true),
      sb.from('scrape_runs').select('*').order('run_at', { ascending: false }).limit(1)
    ]);
    if (res.error) throw res.error;
    listings = res.data || [];
    const run = runs.data?.[0];
    latestDate = run ? run.run_date : listings.reduce((m, l) => (l.first_seen > (m || '') ? l.first_seen : m), null);
    const failed = run && Array.isArray(run.sites_failed) ? run.sites_failed : [];
    $('#status').textContent = (run ? `Last checked ${fmtDate(run.run_date)}.` : 'No daily check has run yet.')
      + (failed.length ? ` ${failed.length} site${failed.length > 1 ? 's' : ''} couldn’t be checked: ${failed.map(f => f.company || f).join(', ')}.` : '');
    await loadMarks();
    loaded = true;
    syncRefineControls();
    rebuild();
  } catch (err) {
    $('#status').textContent = `Listings didn’t load from Supabase (${err.message}). Check the URL and key in config.js, and that schema.sql has been run.`;
  }
}
start();
</script>
</body>
</html>
